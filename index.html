<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP Community Türkiye</title>
  <link rel="stylesheet" href="resources/style.css">
  <link rel="icon" href="resources/SAP Community Turkey.png" type="image/png">
  <script src="resources/app.js?v=20260832" defer></script>
</head>
<body data-page="landing" data-root=".">
  <a class="skip-link" href="#main-content" data-i18n="skipToContent">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="./" aria-label="SAP Community Türkiye home"><span id="site-name">SAP Community Türkiye</span></a>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
        <div id="language-switcher" class="language-switcher" aria-label="Language selection"></div>
    </div>
  </header>
  <main id="main-content" class="page-shell">
    <section class="hero" aria-labelledby="site-title">
      <div class="hero__copy">
        <p class="eyebrow">SAP Community Türkiye</p>
        <h1 id="site-title"></h1>
        <div id="site-description" class="lede"></div>
        <p id="landing-state" class="state" role="status" data-i18n="loadingCommunity">Loading community content...</p>
      </div>
      <div id="logo-slot" class="hero__logo" hidden></div>
    </section>

    <section class="content-section" aria-labelledby="news-heading">
      <div class="section-heading">
          <p class="eyebrow" data-i18n="stayConnected">Stay connected</p>
          <h2 id="news-heading" data-i18n="newsHeading">News &amp; Announcements</h2>
      </div>
      <div id="news-list" class="card-grid"></div>
    </section>

    <section class="content-section" aria-labelledby="upcoming-heading">
      <div class="section-heading">
          <p class="eyebrow" data-i18n="whatIsNext">What is next</p>
          <h2 id="upcoming-heading" data-i18n="upcomingHeading">Upcoming Events</h2>
      </div>
      <div id="upcoming-list" class="card-grid"></div>
    </section>

    <section class="content-section" aria-labelledby="past-heading">
      <div class="section-heading">
          <p class="eyebrow" data-i18n="ourArchive">Our archive</p>
          <h2 id="past-heading" data-i18n="pastHeading">Past Events</h2>
      </div>
      <div id="past-groups" class="group-grid"></div>
        <p class="section-action"><a class="text-link" href="events/" data-i18n="browseLocalEvents">Browse Local Events</a> <span aria-hidden="true">-></span></p>
    </section>
  </main>
  <footer class="site-footer">SAP Community Türkiye</footer>
  <noscript><p class="noscript-message">This site needs JavaScript enabled to load local community content.</p></noscript>
</body>
</html>
