<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Events | SAP Community Türkiye</title>
  <link rel="stylesheet" href="../resources/style.css">
  <link rel="icon" href="../resources/SAP Community Turkey.png" type="image/png">
  <script src="../resources/app.js?v=20260832" defer></script>
</head>
<body data-page="local-events" data-root="..">
  <a class="skip-link" href="#main-content" data-i18n="skipToContent">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="../">SAP Community Türkiye</a>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
      <div id="language-switcher" class="language-switcher" aria-label="Language selection"></div>
    </div>
  </header>
  <main id="main-content" class="page-shell">
    <section class="page-intro" aria-labelledby="page-title">
      <p class="eyebrow">SAP Community Türkiye</p>
      <h1 id="page-title">Events</h1>
      <div id="page-description">Loading event information...</div>
    </section>

    <section class="content-section" aria-labelledby="browse-heading">
      <div class="section-heading">
          <p class="eyebrow" data-i18n="findASession">Find a session</p>
          <h2 id="browse-heading" data-i18n="chooseAGroup">Choose a group</h2>
      </div>
      <div class="filter-bar" aria-label="Event filters">
          <label for="event-type" data-i18n="eventType">Event type</label>
        <select id="event-type"></select>
          <label for="event-city" data-i18n="city">City</label>
        <select id="event-city"></select>
      </div>
      <p id="events-state" class="state" role="status" data-i18n="loadingLocalEvents">Loading local events...</p>
      <div id="event-results" class="card-grid"></div>
    </section>
  </main>
  <footer class="site-footer">SAP Community Türkiye</footer>
  <noscript><p class="noscript-message">This site needs JavaScript enabled to load local community content.</p></noscript>
</body>
</html>
