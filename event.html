<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event | SAP Community Türkiye</title>
  <link rel="stylesheet" href="resources/style.css">
  <link rel="icon" href="resources/SAP Community Turkey.png" type="image/png">
  <script src="resources/app.js?v=20260832" defer></script>
</head>
<body data-page="event-detail" data-root=".">
  <a class="skip-link" href="#main-content" data-i18n="skipToContent">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="./">SAP Community Türkiye</a>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
      <div id="language-switcher" class="language-switcher" aria-label="Language selection"></div>
    </div>
  </header>
  <main id="main-content" class="page-shell">
      <p class="section-action"><a class="text-link" href="events/" data-i18n="backToLocalEvents">&lt;- Back to Local Events</a></p>
      <p id="event-state" class="state" role="status" data-i18n="loadingEventInfo">Loading event...</p>
    <article id="event-content" class="event-detail" hidden>
      <header class="event-detail__header">
        <div>
          <p id="event-type" class="eyebrow"></p>
          <h1 id="event-title"></h1>
          <dl id="event-meta" class="event-meta"></dl>
        </div>
        <div id="event-image-slot" class="event-detail__image" hidden></div>
      </header>
      <section class="content-section" aria-labelledby="agenda-heading">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="theDayAtAGlance">The day at a glance</p>
          <h2 id="agenda-heading" data-i18n="agenda">Agenda</h2>
        </div>
        <ol id="agenda-list" class="agenda-list"></ol>
      </section>
    </article>
  </main>
  <footer class="site-footer">SAP Community Türkiye</footer>
  <noscript><p class="noscript-message">This site needs JavaScript enabled to load local community content.</p></noscript>
</body>
</html>
